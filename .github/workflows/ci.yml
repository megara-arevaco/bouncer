name: Validate and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: bouncer-test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:bouncer-test@127.0.0.1:5432/postgres' || '' }}
      - run: npx playwright install --with-deps chromium
        if: matrix.database == 'sqlite'
      - run: npm run docs:check && npm run test:e2e
        if: matrix.database == 'sqlite'
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.database == 'sqlite'
        with:
          name: browser-failures
          path: test-results/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:pack
      - run: npm run release:check
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/"$GITHUB_REF_NAME"/*.tgz artifacts/"$GITHUB_REF_NAME"/SHA256SUMS
          --verify-tag --title "Bouncer $GITHUB_REF_NAME" --generate-notes
